name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build, typecheck and test
    runs-on: ubuntu-latest
    strategy:
      # Report every Node version even if one fails; a single-version failure is
      # much easier to read when the other two still run.
      fail-fast: false
      matrix:
        # The published bundle targets Node 18+.
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # FamiStudio is not available on the runners, so the FamiStudio-backed
      # checks (verify / oracle / pitch) cannot run here; contributors run them
      # locally. AGENTS.md documents the commands (section 2) and the format
      # invariants those checks guard (section 4).
      - name: Smoke-test the executables
        run: |
          node dist/index.js --version
          node dist/index.js --tools
          node dist/cli.js info
          node -e "import('./dist/core/index.js').then(m => {
            const { project } = m.compileSongSpec({ name: 'CI', channels: [{ channel: 'Square1', notes: ['C4'] }] });
            const bytes = m.writeFms(project);
            if (!m.readProject(bytes).songs.length) process.exit(1);
            console.log('core codec ok:', bytes.byteLength, 'bytes');
          })"

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify the tarball ships what it should
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for expected in dist/index.js dist/cli.js dist/core/index.js README.md LICENSE CHANGELOG.md; do
            grep -q "$expected" /tmp/pack.txt || { echo "missing from package: $expected"; exit 1; }
          done
